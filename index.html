<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top Lanches e Açaí - Delivery</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        html { scroll-behavior: smooth; }
        body { font-family: 'Inter', sans-serif; background-color: #f9fafb; }
        .modal { display: none; opacity: 0; transition: opacity 0.3s ease; }
        .modal.active { display: flex; opacity: 1; }
        /* Scrollbar customizada para ficar mais bonito no celular */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #f97316; border-radius: 4px; }
        /* Ocultar barra de rolagem horizontal no menu superior */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="pb-28">

    <header class="bg-orange-600 text-white p-6 shadow-lg text-center border-b-4 border-black">
        <h1 class="text-3xl font-black tracking-tight uppercase">Top Lanches e Açaí</h1>
        <p class="text-sm mt-1 text-orange-100 font-medium">Hamburgueria Artesanal - Delivery</p>
    </header>

    <!-- Menu Superior Deslizante (Sticky) -->
    <nav class="sticky top-0 z-30 bg-white shadow-sm border-b border-gray-200 overflow-x-auto whitespace-nowrap py-3 px-4 flex gap-3 hide-scrollbar items-center">
        <a href="#sec-lanches" class="px-4 py-2 bg-orange-100 text-orange-700 font-bold rounded-full text-sm hover:bg-orange-200 transition">🍔 Lanches</a>
        <a href="#sec-acai" class="px-4 py-2 bg-purple-100 text-purple-700 font-bold rounded-full text-sm hover:bg-purple-200 transition">💜 Açaí</a>
        <a href="#sec-bebidas" class="px-4 py-2 bg-gray-100 text-gray-700 font-bold rounded-full text-sm hover:bg-gray-200 transition">🥤 Bebidas</a>
    </nav>

    <main class="max-w-3xl mx-auto mt-6 px-4">
        
        <!-- Categoria: Lanches -->
        <h2 id="sec-lanches" class="scroll-mt-24 text-2xl font-black text-gray-900 mb-4 border-b-2 border-orange-500 pb-1 uppercase">Cardápio Hambúrguer</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8" id="menu-lanches">
            <!-- Os itens serão gerados via JS para facilitar a manutenção -->
        </div>

        <!-- Categoria: Açaí -->
        <h2 id="sec-acai" class="scroll-mt-24 text-2xl font-black text-purple-800 mb-4 border-b-2 border-purple-600 pb-1 uppercase mt-8 flex items-center gap-2">
            Monte seu Açaí
        </h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8" id="menu-acai">
            <!-- Os itens serão gerados via JS -->
        </div>

        <!-- Categoria: Bebidas -->
        <h2 id="sec-bebidas" class="scroll-mt-24 text-2xl font-black text-gray-900 mb-4 border-b-2 border-orange-500 pb-1 uppercase mt-8">Bebidas</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8" id="menu-bebidas">
             <!-- Os itens serão gerados via JS -->
        </div>
    </main>

    <div class="fixed bottom-0 left-0 w-full bg-white p-4 shadow-[0_-10px_15px_-3px_rgba(0,0,0,0.1)] flex justify-between items-center z-40 border-t border-gray-200">
        <div>
            <p class="text-sm text-gray-500 font-medium">Total do Pedido</p>
            <p class="text-2xl font-black text-gray-900" id="cart-total">R$ 0,00</p>
        </div>
        <button onclick="openCheckout()" class="bg-orange-600 text-white px-6 py-3 rounded-xl font-bold shadow-md hover:bg-orange-700 transition flex items-center gap-2">
            Ver Carrinho
            <span id="cart-count" class="bg-white text-orange-600 px-2 py-1 rounded-full text-xs">0</span>
        </button>
    </div>

    <div id="product-modal" class="modal fixed inset-0 bg-black bg-opacity-60 z-50 justify-center items-end sm:items-center">
        <div class="bg-white w-full sm:w-[450px] rounded-t-3xl sm:rounded-2xl p-4 sm:p-6 max-h-[85vh] flex flex-col relative">
            <button onclick="closeProductModal()" class="absolute top-3 right-3 sm:top-4 sm:right-4 text-gray-400 hover:text-gray-700 bg-gray-100 rounded-full w-8 h-8 flex items-center justify-center font-bold text-xl">&times;</button>
            
            <div class="overflow-y-auto flex-1 pr-1 sm:pr-2" id="product-modal-content">
                <h2 id="modal-p-name" class="text-xl sm:text-2xl font-black text-gray-900 pr-8">Nome</h2>
                <p id="modal-p-desc" class="text-xs sm:text-sm text-gray-500 mt-1 sm:mt-2 mb-3 sm:mb-4 leading-relaxed">Descrição</p>
                <p id="modal-p-price" class="text-lg sm:text-xl font-bold text-orange-600 mb-4 sm:mb-6 border-b pb-3 sm:pb-4">R$ 0,00</p>

                <div class="mb-4 sm:mb-6">
                    <label class="block text-xs sm:text-sm font-bold text-gray-700 mb-2 uppercase tracking-wide">Quantidade deste item</label>
                    <div class="flex items-center gap-4">
                        <button onclick="changeModalQty(-1)" class="w-10 h-10 rounded-full bg-gray-200 flex items-center justify-center font-bold text-xl text-gray-700 hover:bg-gray-300">-</button>
                        <span id="modal-p-qty" class="text-xl font-bold w-8 text-center">1</span>
                        <button onclick="changeModalQty(1)" class="w-10 h-10 rounded-full bg-orange-100 flex items-center justify-center font-bold text-xl text-orange-600 hover:bg-orange-200">+</button>
                    </div>
                </div>

                <div id="adicionais-container" class="mb-4 sm:mb-6">
                    <div class="flex justify-between items-center bg-gray-100 p-2 rounded mb-3">
                        <h3 id="modal-adicionais-title" class="text-xs sm:text-sm font-bold text-gray-700 uppercase tracking-wide">Turbine seu lanche</h3>
                        <span id="modal-adicionais-limit" class="text-[10px] sm:text-xs font-bold text-purple-600 hidden bg-purple-100 px-2 py-1 rounded">0/0</span>
                    </div>
                    <div id="adicionais-list" class="space-y-2 sm:space-y-3">
                        <!-- Adicionais injetados aqui -->
                    </div>
                </div>
            </div>

            <div class="pt-3 sm:pt-4 border-t mt-2">
                <button onclick="confirmAddToCart()" class="w-full bg-black text-white font-bold py-3 sm:py-4 rounded-xl flex justify-between items-center px-4 hover:bg-gray-800 transition">
                    <span>Adicionar</span>
                    <span id="modal-p-total">R$ 0,00</span>
                </button>
            </div>
        </div>
    </div>

    <div id="checkout-modal" class="modal fixed inset-0 bg-black bg-opacity-60 z-50 justify-center items-end sm:items-center">
        <div class="bg-white w-full sm:w-[500px] rounded-t-3xl sm:rounded-2xl p-4 sm:p-6 max-h-[85vh] flex flex-col relative">
            <div class="flex justify-between items-center mb-3 sm:mb-4 pb-2 sm:pb-3 border-b">
                <h2 class="text-lg sm:text-xl font-black uppercase">Seu Pedido</h2>
                <button onclick="closeCheckout()" class="text-gray-400 hover:text-gray-700 bg-gray-100 rounded-full w-8 h-8 flex items-center justify-center font-bold text-xl">&times;</button>
            </div>
            
            <div class="overflow-y-auto flex-1 pr-1 sm:pr-2">
                <div id="cart-items" class="mb-4 sm:mb-6 text-xs sm:text-sm text-gray-700 space-y-3 sm:space-y-4">
                    <!-- Items will be injected here -->
                </div>

                <div class="space-y-3 sm:space-y-4 bg-gray-50 p-3 sm:p-4 rounded-xl border border-gray-100">
                    <h3 class="font-bold text-sm sm:text-base text-gray-800 border-b pb-1 sm:pb-2">Dados de Entrega</h3>
                    <div>
                        <label class="block text-[10px] sm:text-xs font-bold text-gray-500 uppercase">Seu Nome</label>
                        <input type="text" id="c-name" class="w-full border-gray-300 border rounded-lg p-2 sm:p-3 mt-1 outline-none focus:border-orange-500 focus:ring-1 focus:ring-orange-500" placeholder="Ex: João Silva">
                    </div>
                    
                    <div class="grid grid-cols-3 gap-2">
                        <div class="col-span-2">
                            <label class="block text-[10px] sm:text-xs font-bold text-gray-500 uppercase">Rua</label>
                            <input type="text" id="c-address" class="w-full border-gray-300 border rounded-lg p-2 sm:p-3 mt-1 outline-none focus:border-orange-500" placeholder="Nome da rua">
                        </div>
                        <div class="col-span-1">
                            <label class="block text-[10px] sm:text-xs font-bold text-gray-500 uppercase">Número</label>
                            <input type="text" id="c-number" class="w-full border-gray-300 border rounded-lg p-2 sm:p-3 mt-1 outline-none focus:border-orange-500" placeholder="Ex: 123">
                        </div>
                    </div>
                    <div>
                        <label class="block text-[10px] sm:text-xs font-bold text-gray-500 uppercase">Bairro</label>
                        <input type="text" id="c-neighborhood" class="w-full border-gray-300 border rounded-lg p-2 sm:p-3 mt-1 outline-none focus:border-orange-500" placeholder="Seu bairro">
                    </div>

                    <h3 class="font-bold text-sm sm:text-base text-gray-800 border-b pb-1 sm:pb-2 pt-1 sm:pt-2">Pagamento</h3>
                    <div>
                        <label class="block text-[10px] sm:text-xs font-bold text-gray-500 uppercase">Como vai pagar?</label>
                        <select id="c-payment" class="w-full border-gray-300 border rounded-lg p-2 sm:p-3 mt-1 outline-none focus:border-orange-500 bg-white" onchange="toggleTroco()">
                            <option value="PIX">PIX</option>
                            <option value="Cartão de Crédito">Cartão de Crédito (Maquininha)</option>
                            <option value="Cartão de Débito">Cartão de Débito (Maquininha)</option>
                            <option value="Dinheiro">Dinheiro</option>
                        </select>
                    </div>
                    
                    <div id="troco-container" class="hidden">
                        <label class="block text-[10px] sm:text-xs font-bold text-gray-500 uppercase text-orange-600">Troco para quanto?</label>
                        <input type="number" id="c-troco" class="w-full border-orange-300 border-2 rounded-lg p-2 sm:p-3 mt-1 outline-none focus:border-orange-600 bg-orange-50" placeholder="Ex: 100">
                    </div>
                </div>
            </div>
            
            <div class="pt-3 sm:pt-4 mt-2 bg-white">
                <button onclick="sendOrder()" class="w-full bg-green-600 hover:bg-green-700 text-white font-black py-3 sm:py-4 rounded-xl flex justify-center items-center gap-2 transition text-base sm:text-lg shadow-lg">
                    <svg class="w-5 h-5 sm:w-6 sm:h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51a12.8 12.8 0 0 0-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413Z"/></svg>
                    Enviar Pedido
                </button>
            </div>
        </div>
    </div>

    <script>
        // Configurações
        const WHATSAPP_NUMBER = "5515991434775"; // O número do flyer
        let cart = [];
        
        // Estado temporário do modal de produto
        let currentProduct = null;
        let currentProductType = null;
        let currentProductQty = 1;
        let currentAdicionais = {};
        let currentAcaiSelectedCount = 0;

        // Banco de Dados de Produtos (Baseado na Imagem)
        const dbLanches = [
            { id: 'h1', name: 'X-BURGUER', price: 20.00, desc: 'Pão, hambúrguer artesanal, mussarela, maionese e catupiry.' },
            { id: 'h2', name: 'DUPLO X BURGUER', price: 28.00, desc: 'Pão, 2 hambúrgueres artesanais, mussarela, maionese e catupiry.' },
            { id: 'h3', name: 'X-MILHO', price: 22.00, desc: 'Pão, hambúrguer artesanal, mussarela, milho, tomate, maionese e catupiry.' },
            { id: 'h4', name: 'X-EGG', price: 22.00, desc: 'Pão, hambúrguer artesanal, mussarela, tomate, ovo, maionese e catupiry.' },
            { id: 'h5', name: 'X-SALADA', price: 24.00, desc: 'Pão, hambúrguer artesanal, mussarela, alface, tomate, maionese e catupiry.' },
            { id: 'h6', name: 'X FRANGO', price: 27.00, desc: 'Pão, hambúrguer artesanal, frango, mussarela, tomate, maionese e catupiry.' },
            { id: 'h7', name: 'X-CALABRESA', price: 28.00, desc: 'Pão, hambúrguer artesanal, mussarela, calabresa, tomate, maionese e catupiry.' },
            { id: 'h8', name: 'X-BACON', price: 28.00, desc: 'Pão, hambúrguer artesanal, mussarela, bacon, tomate, maionese e catupiry.' },
            { id: 'h9', name: 'X SALADA BACON', price: 30.00, desc: 'Pão, hambúrguer artesanal, bacon, alface, mussarela, tomate, maionese e catupiry.' },
            { id: 'h10', name: 'CALABACON', price: 32.00, desc: 'Pão, hambúrguer artesanal, mussarela, calabresa, bacon, tomate, maionese e catupiry.' },
            { id: 'h11', name: 'BACON CHEDDAR', price: 32.00, desc: 'Pão, hambúrguer artesanal, mussarela, bacon, cheddar, tomate, maionese e catupiry.' },
            { id: 'h12', name: 'FRANGO 3 QUEIJOS', price: 34.00, desc: 'Pão, hambúrguer artesanal, frango, mussarela, cheddar, tomate, maionese e catupiry.' },
            { id: 'l1', name: 'CALAFRANGO', price: 34.00, desc: 'Pão, hambúrguer artesanal, calabresa, mussarela, frango, tomate, maionese e catupiry.' },
            { id: 'l2', name: 'FRANBACON', price: 34.00, desc: 'Pão, hambúrguer artesanal, frango, bacon, mussarela, tomate, maionese e catupiry.' },
            { id: 'l3', name: 'TOP BACON', price: 36.00, desc: 'Pão, hambúrguer artesanal, bacon, 100 gramas de catupiry, mussarela, tomate e maionese.' },
            { id: 'l4', name: 'DUPLO BURGUER CHEDDAR', price: 32.00, desc: 'Pão, 2 hambúrgueres artesanais, cheddar, maionese e catupiry.' },
            { id: 'l5', name: 'TOP LANCHE 2.0', price: 38.00, desc: 'Pão, 2 hambúrgueres artesanais, mussarela, tomate, maionese, cebola fatiada, molho barbecue, cheddar e catupiry.' },
            { id: 'l6', name: 'DUPLO BACON CHEDDAR', price: 43.00, desc: 'Pão, 2 hambúrgueres artesanais, bacon, cheddar, mussarela, tomate, maionese e catupiry.' },
            { id: 'l7', name: 'BACON 3 QUEIJOS', price: 36.00, desc: 'Pão, 1 hambúrguer artesanal, bacon, cheddar e mussarela, tomate, maionese e catupiry.' },
            { id: 'l8', name: 'X TUDO', price: 50.00, desc: 'Pão, hambúrguer artesanal, frango, bacon, calabresa, mussarela, tomate, alface, 1 salsicha, batata palha, ovo, milho, maionese e catupiry.' }
        ];

        const dbAdicionais = [
            { id: 'a1', name: 'Hambúrguer', price: 9.00 },
            { id: 'a2', name: 'Bacon', price: 6.00 },
            { id: 'a3', name: 'Calabresa', price: 6.00 },
            { id: 'a4', name: 'Cheddar', price: 6.00 },
            { id: 'a5', name: 'Catupiry', price: 6.00 }
        ];

        const dbAcai = [
            { id: 'ac1', name: 'Açaí 200ml', price: 13.00, desc: 'Escolha até 4 adicionais', limit: 4 },
            { id: 'ac2', name: 'Açaí 300ml', price: 17.00, desc: 'Escolha até 6 adicionais', limit: 6 },
            { id: 'ac3', name: 'Açaí 500ml', price: 23.00, desc: 'Escolha até 6 adicionais', limit: 6 },
            { id: 'ac4', name: 'Açaí 770ml', price: 30.00, desc: 'Escolha até 8 adicionais', limit: 8 },
            { id: 'ac5', name: 'Açaí 1 Litro', price: 38.00, desc: 'Escolha até 10 adicionais', limit: 10 },
            { id: 'ac6', name: 'Barca de Açaí 350ml', price: 25.00, desc: 'Escolha até 5 adicionais', limit: 5 },
            { id: 'ac7', name: 'Roleta Açaí Pequena', price: 18.00, desc: 'Escolha até 4 adicionais', limit: 4 },
            { id: 'ac8', name: 'Roleta Açaí Grande', price: 45.00, desc: 'Escolha até 6 adicionais', limit: 6 }
        ];

        const dbAdicionaisAcai = [
            { id: 'aa1', name: 'Bolacha Oreo' },
            { id: 'aa2', name: 'Bis chocolate ao leite' },
            { id: 'aa3', name: 'Bis chocolate branco' },
            { id: 'aa4', name: 'Granola' },
            { id: 'aa5', name: 'Sucrilhos' },
            { id: 'aa6', name: 'Banana' },
            { id: 'aa7', name: 'Morango' },
            { id: 'aa8', name: 'Manga' },
            { id: 'aa9', name: 'Uva' },
            { id: 'aa10', name: 'Paçoca' },
            { id: 'aa11', name: 'Confete' },
            { id: 'aa12', name: 'Leite condensado' },
            { id: 'aa13', name: 'Leite em pó' }
        ];

        const dbBebidas = [
            { id: 'b1', name: 'Refrigerante Lata', price: 7.00, desc: 'Lata 350ml' },
            { id: 'b2', name: 'Coca Cola 2 litros', price: 16.00, desc: 'Garrafa 2L' },
            { id: 'b3', name: 'Refrigerante Guaraná Kuat', price: 11.00, desc: 'Garrafa 2L' },
            { id: 'b4', name: 'Suco Del Valle 1,500ml', price: 9.00, desc: 'Garrafa 1.5L' }
        ];

        // Formatador de Moeda
        const formatMoney = (value) => `R$ ${value.toFixed(2).replace('.', ',')}`;

        function initMenu() {
            const containerLanches = document.getElementById('menu-lanches');
            dbLanches.forEach(item => {
                containerLanches.innerHTML += createProductCard(item, 'lanche');
            });

            const containerAcai = document.getElementById('menu-acai');
            dbAcai.forEach(item => {
                containerAcai.innerHTML += createProductCard(item, 'acai');
            });

            const containerBebidas = document.getElementById('menu-bebidas');
            dbBebidas.forEach(item => {
                containerBebidas.innerHTML += createProductCard(item, 'bebida');
            });
        }

        function createProductCard(item, type) {
            let badgeColor = type === 'acai' ? 'bg-purple-100 text-purple-700' : 'bg-orange-100 text-orange-600';
            let priceColor = type === 'acai' ? 'text-purple-700' : 'text-orange-600';

            return `
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 flex flex-col justify-between hover:shadow-md transition cursor-pointer" onclick='openProductModal(${JSON.stringify(item)}, "${type}")'>
                <div>
                    <h3 class="font-black text-gray-800 text-lg uppercase">${item.name}</h3>
                    <p class="text-xs text-gray-500 mt-2 line-clamp-3 leading-relaxed">${item.desc}</p>
                </div>
                <div class="flex justify-between items-end mt-4">
                    <p class="font-black ${priceColor} text-lg">${formatMoney(item.price)}</p>
                    <div class="${badgeColor} p-2 rounded-full flex items-center justify-center">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                    </div>
                </div>
            </div>`;
        }

        function openProductModal(item, type) {
            currentProduct = item;
            currentProductType = type;
            currentProductQty = 1;
            currentAdicionais = {}; // Limpa adicionais
            currentAcaiSelectedCount = 0;

            document.getElementById('modal-p-name').innerText = item.name;
            document.getElementById('modal-p-desc').innerText = item.desc;
            document.getElementById('modal-p-price').innerText = formatMoney(item.price);
            document.getElementById('modal-p-qty').innerText = currentProductQty;

            const addonsContainer = document.getElementById('adicionais-container');
            const addonsList = document.getElementById('adicionais-list');
            const addonsLimitBadge = document.getElementById('modal-adicionais-limit');
            const addonsTitle = document.getElementById('modal-adicionais-title');
            
            if (type === 'lanche') {
                addonsContainer.classList.remove('hidden');
                addonsLimitBadge.classList.add('hidden');
                addonsTitle.innerText = 'Turbine seu lanche (Opcional)';
                addonsList.innerHTML = '';
                dbAdicionais.forEach(add => {
                    currentAdicionais[add.id] = { ...add, qty: 0, isFree: false };
                    addonsList.innerHTML += `
                        <div class="flex justify-between items-center bg-gray-50 p-2 rounded-lg border border-gray-100">
                            <div>
                                <p class="font-bold text-sm text-gray-800">${add.name}</p>
                                <p class="text-xs text-orange-600 font-bold">+ ${formatMoney(add.price)}</p>
                            </div>
                            <div class="flex items-center gap-3">
                                <button onclick="changeAdicionalQty('${add.id}', -1)" class="w-7 h-7 rounded-full bg-white border border-gray-300 flex items-center justify-center font-bold text-gray-600">-</button>
                                <span id="add-qty-${add.id}" class="text-sm font-bold w-4 text-center">0</span>
                                <button onclick="changeAdicionalQty('${add.id}', 1)" class="w-7 h-7 rounded-full bg-orange-100 flex items-center justify-center font-bold text-orange-600">+</button>
                            </div>
                        </div>
                    `;
                });
            } else if (type === 'acai') {
                addonsContainer.classList.remove('hidden');
                addonsLimitBadge.classList.remove('hidden');
                addonsTitle.innerText = 'Escolha seus complementos';
                updateAcaiLimitBadge();
                
                addonsList.innerHTML = '';
                dbAdicionaisAcai.forEach(add => {
                    currentAdicionais[add.id] = { ...add, price: 0, qty: 0, isFree: true };
                    addonsList.innerHTML += `
                        <div class="flex justify-between items-center bg-gray-50 p-2 rounded-lg border border-gray-100">
                            <div>
                                <p class="font-bold text-sm text-gray-800">${add.name}</p>
                                <p class="text-xs text-purple-600 font-bold">Grátis</p>
                            </div>
                            <div class="flex items-center gap-3">
                                <button onclick="changeAdicionalQty('${add.id}', -1)" class="w-7 h-7 rounded-full bg-white border border-gray-300 flex items-center justify-center font-bold text-gray-600">-</button>
                                <span id="add-qty-${add.id}" class="text-sm font-bold w-4 text-center">0</span>
                                <button onclick="changeAdicionalQty('${add.id}', 1)" class="w-7 h-7 rounded-full bg-purple-100 flex items-center justify-center font-bold text-purple-700">+</button>
                            </div>
                        </div>
                    `;
                });
            } else {
                addonsContainer.classList.add('hidden');
            }

            updateModalTotal();
            document.getElementById('product-modal').classList.add('active');
        }

        function closeProductModal() {
            document.getElementById('product-modal').classList.remove('active');
        }

        function changeModalQty(delta) {
            if (currentProductQty + delta >= 1) {
                currentProductQty += delta;
                document.getElementById('modal-p-qty').innerText = currentProductQty;
                updateModalTotal();
            }
        }

        function changeAdicionalQty(addId, delta) {
            const add = currentAdicionais[addId];
            
            // Lógica específica para Açaí (Limite de Adicionais)
            if (currentProductType === 'acai') {
                if (delta > 0 && currentAcaiSelectedCount >= currentProduct.limit) {
                    alert(`Você já atingiu o limite de ${currentProduct.limit} adicionais para este tamanho.`);
                    return;
                }
                if (add.qty + delta >= 0 && add.qty + delta <= 1) { // Limita 1 de cada tipo no açaí (comum em app)
                    add.qty += delta;
                    currentAcaiSelectedCount += delta;
                    document.getElementById(`add-qty-${addId}`).innerText = add.qty;
                    updateAcaiLimitBadge();
                }
            } 
            // Lógica para Lanches (Sem limite, pode pedir 3 bacons se quiser)
            else {
                if (add.qty + delta >= 0) {
                    add.qty += delta;
                    document.getElementById(`add-qty-${addId}`).innerText = add.qty;
                }
            }
            
            updateModalTotal();
        }

        function updateAcaiLimitBadge() {
            if(currentProductType === 'acai') {
                const badge = document.getElementById('modal-adicionais-limit');
                badge.innerText = `${currentAcaiSelectedCount}/${currentProduct.limit}`;
                if (currentAcaiSelectedCount >= currentProduct.limit) {
                    badge.classList.remove('bg-purple-100', 'text-purple-600');
                    badge.classList.add('bg-green-100', 'text-green-700');
                } else {
                    badge.classList.add('bg-purple-100', 'text-purple-600');
                    badge.classList.remove('bg-green-100', 'text-green-700');
                }
            }
        }

        function updateModalTotal() {
            let totalAdicionais = 0;
            for (let key in currentAdicionais) {
                if (!currentAdicionais[key].isFree) {
                    totalAdicionais += currentAdicionais[key].price * currentAdicionais[key].qty;
                }
            }

            const itemTotalPrice = (currentProduct.price + totalAdicionais) * currentProductQty;
            document.getElementById('modal-p-total').innerText = formatMoney(itemTotalPrice);
        }

        function confirmAddToCart() {
            let totalAdicionais = 0;
            let extrasSelected = [];
            
            for (let key in currentAdicionais) {
                if (currentAdicionais[key].qty > 0) {
                    if (!currentAdicionais[key].isFree) {
                        totalAdicionais += currentAdicionais[key].price * currentAdicionais[key].qty;
                    }
                    extrasSelected.push(currentAdicionais[key]);
                }
            }

            const itemTotalPrice = (currentProduct.price + totalAdicionais) * currentProductQty;

            cart.push({
                product: currentProduct,
                qty: currentProductQty,
                extras: extrasSelected,
                totalPrice: itemTotalPrice
            });

            updateCartUI();
            closeProductModal();
            
            // Efeito visual no botão do carrinho flutuante
            const cartBtn = document.querySelector('.fixed.bottom-0 button');
            cartBtn.classList.add('scale-110');
            setTimeout(() => cartBtn.classList.remove('scale-110'), 200);
        }

        function removeCartItem(index) {
            cart.splice(index, 1);
            updateCartUI();
            renderCheckoutItems(); // Atualiza a lista se estiver com modal de checkout aberto
            
            if(cart.length === 0) {
                closeCheckout();
            }
        }

        function updateCartUI() {
            const total = cart.reduce((sum, item) => sum + item.totalPrice, 0);
            document.getElementById('cart-total').innerText = formatMoney(total);
            document.getElementById('cart-count').innerText = cart.reduce((sum, item) => sum + item.qty, 0);
        }

        function openCheckout() {
            if (cart.length === 0) {
                alert("Seu carrinho está vazio! Adicione algum lanche primeiro.");
                return;
            }
            renderCheckoutItems();
            document.getElementById('checkout-modal').classList.add('active');
        }

        function closeCheckout() {
            document.getElementById('checkout-modal').classList.remove('active');
        }

        function renderCheckoutItems() {
            const cartItemsDiv = document.getElementById('cart-items');
            cartItemsDiv.innerHTML = '';
            
            cart.forEach((cartItem, index) => {
                let extrasHTML = '';
                if(cartItem.extras.length > 0) {
                    extrasHTML = `<ul class="text-xs text-gray-500 mt-1 pl-4 list-disc">`;
                    cartItem.extras.forEach(ext => {
                        extrasHTML += `<li>${ext.qty}x Adicional de ${ext.name}</li>`;
                    });
                    extrasHTML += `</ul>`;
                }

                cartItemsDiv.innerHTML += `
                    <div class="flex justify-between items-start border-b pb-3">
                        <div class="flex-1">
                            <p class="font-bold text-gray-800">${cartItem.qty}x ${cartItem.product.name}</p>
                            ${extrasHTML}
                            <p class="text-sm font-bold text-orange-600 mt-1">${formatMoney(cartItem.totalPrice)}</p>
                        </div>
                        <button onclick="removeCartItem(${index})" class="text-red-500 hover:text-red-700 bg-red-50 p-2 rounded-lg text-xs font-bold ml-2">Remover</button>
                    </div>
                `;
            });
        }

        function toggleTroco() {
            const payment = document.getElementById('c-payment').value;
            const trocoContainer = document.getElementById('troco-container');
            if (payment === 'Dinheiro') {
                trocoContainer.classList.remove('hidden');
            } else {
                trocoContainer.classList.add('hidden');
                document.getElementById('c-troco').value = '';
            }
        }

        function sendOrder() {
            const name = document.getElementById('c-name').value.trim();
            const address = document.getElementById('c-address').value.trim();
            const number = document.getElementById('c-number').value.trim();
            const neighborhood = document.getElementById('c-neighborhood').value.trim();
            const payment = document.getElementById('c-payment').value;
            const troco = document.getElementById('c-troco').value;

            if(!name || !address || !number || !neighborhood) {
                alert("Por favor, preencha todos os dados de entrega (Nome, Rua, Número e Bairro).");
                return;
            }

            // Salva os dados de forma segura e persistente para a próxima visita
            if (window.saveUserDataToCloud) {
                window.saveUserDataToCloud(name, address, number, neighborhood);
            }

            // OTIMIZADO PARA IMPRESSORA TÉRMICA
            let text = `*PEDIDO - TOP LANCHES E AÇAÍ*\n`;
            text += `--------------------------------\n`;
            text += `*CLIENTE:* ${name.toUpperCase()}\n`;
            text += `*ENDEREÇO:* ${address.toUpperCase()}, ${number}\n`;
            text += `*BAIRRO:* ${neighborhood.toUpperCase()}\n`;
            text += `--------------------------------\n`;
            text += `*ITENS DO PEDIDO:*\n\n`;
            
            let totalOrderPrice = 0;

            cart.forEach(item => {
                totalOrderPrice += item.totalPrice;
                // Item principal
                text += `-> ${item.qty}x ${item.product.name.toUpperCase()} (R$ ${(item.product.price * item.qty).toFixed(2).replace('.',',')})\n`;
                
                // Adicionais com identação (espaços no começo) para impressora
                if (item.extras.length > 0) {
                    item.extras.forEach(ext => {
                        let extraPriceText = ext.price > 0 ? `(R$ ${(ext.price * ext.qty * item.qty).toFixed(2).replace('.',',')})` : '(Grátis)';
                        text += `   + ${item.qty * ext.qty}x ADC. ${ext.name.toUpperCase()} ${extraPriceText}\n`;
                    });
                }
                text += `\n`; // Espaço entre os lanches
            });
            
            text += `--------------------------------\n`;
            text += `*TOTAL A PAGAR:* ${formatMoney(totalOrderPrice)}\n`;
            text += `*PAGAMENTO:* ${payment.toUpperCase()}\n`;
            
            if (payment === 'Dinheiro' && troco) {
                const trocoNum = parseFloat(troco);
                if(trocoNum > totalOrderPrice) {
                    const valorTroco = trocoNum - totalOrderPrice;
                    text += `*LEVAR TROCO DE:* ${formatMoney(valorTroco)} (Para ${formatMoney(trocoNum)})\n`;
                } else {
                    text += `*LEVAR TROCO DE:* Não precisa de troco\n`;
                }
            }
            text += `--------------------------------\n`;
            text += `Aguardamos a confirmação. Obrigado!`;

            const encodedText = encodeURIComponent(text);
            const whatsappUrl = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodedText}`;
            
            window.open(whatsappUrl, '_blank');
            
            // Opcional: Limpar após o envio
            // closeCheckout();
            // cart = [];
            // updateCartUI();
        }

        // Inicializa o menu ao carregar a página
        window.onload = initMenu;

    </script>

    <!-- Sistema de Salvamento Seguro (Mais persistente que o LocalStorage) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;
        
        let db, auth, userId;

        if (firebaseConfig && Object.keys(firebaseConfig).length > 0) {
            const app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);

            const initAuth = async () => {
                try {
                    // Autenticação silenciosa para o cliente
                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } else {
                        await signInAnonymously(auth);
                    }
                    userId = auth.currentUser?.uid;
                    loadUserData();
                } catch (error) {
                    console.error("Erro no sistema de login automático:", error);
                }
            };

            const loadUserData = async () => {
                if (!userId) return;
                try {
                    const docRef = doc(db, 'artifacts', appId, 'users', userId, 'profile', 'delivery_info');
                    const docSnap = await getDoc(docRef);
                    
                    // Se o cliente já comprou antes, preenche os dados automaticamente
                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        if(data.name) document.getElementById('c-name').value = data.name;
                        if(data.address) document.getElementById('c-address').value = data.address;
                        if(data.number) document.getElementById('c-number').value = data.number;
                        if(data.neighborhood) document.getElementById('c-neighborhood').value = data.neighborhood;
                    }
                } catch (e) {
                    console.error("Erro ao carregar endereço:", e);
                }
            };

            window.saveUserDataToCloud = async (name, address, number, neighborhood) => {
                if (!userId || !db) return;
                try {
                    const docRef = doc(db, 'artifacts', appId, 'users', userId, 'profile', 'delivery_info');
                    // Salva as informações após ele enviar o pedido
                    await setDoc(docRef, { name, address, number, neighborhood }, { merge: true });
                } catch (e) {
                    console.error("Erro ao salvar dados de entrega:", e);
                }
            };

            initAuth();
        } else {
            // Fallback silencioso caso a configuração de nuvem não esteja ativa
            window.saveUserDataToCloud = async () => {}; 
        }
    </script>
